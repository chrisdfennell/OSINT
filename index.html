<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSINT Command Center</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
</head>
<body>
  <!-- Top Bar -->
  <header id="topbar">
    <div class="topbar-left">
      <button id="sidebar-toggle" aria-label="Toggle sidebar">&#9776;</button>
      <h1>OSINT Command Center</h1>
    </div>
    <div class="topbar-center">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" id="search" placeholder="Search tools, categories..." autocomplete="off">
        <kbd>Ctrl+K</kbd>
      </div>
    </div>
    <div class="topbar-right">
      <button id="expand-all-btn" title="Expand all categories">Expand All</button>
      <button id="collapse-all-btn" title="Collapse all categories">Collapse All</button>
      <button id="favorites-filter" title="Show favorites only">&#9733; Favorites</button>
      <span id="tool-count"></span>
    </div>
  </header>

  <!-- Sidebar Navigation -->
  <nav id="sidebar">
    <ul id="category-nav"></ul>
  </nav>

  <!-- Main Content -->
  <main id="content">
    <div id="categories-container"></div>
    <div id="no-results" class="hidden">
      <p>No tools match your search.</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
